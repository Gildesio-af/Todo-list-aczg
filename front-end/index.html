<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&display=swap" rel="stylesheet">
    <title>Todo List</title>
</head>

<body>
    <header>
        <div id="search-task">
            <img src="assets/magnifying-glass.svg" alt="Lupa">
            <input type="text" name="search-task" id="search-task" placeholder="Buscar tarefas..." class="search-item">
        </div>

        <button class="button-white">
            <img src="assets/plus.svg" alt="Adicionar">
            <span>Nova Tarefa</span>
        </button>

    </header>
    <aside>
        <div id="title">
            <div>
                <img src="assets/correct.svg" alt="item de correto">
            </div>
            <h2 class="sub-title">TaskFlow</h2>
        </div>
        <ul>
            <li class="aside-session-selected">
                <img src="assets/task.svg" alt="icone de tarefa">
                <p class="text-black">Minhas tarefas</p>
            </li>
            <li>
                <img src="assets/star.png" alt="icone de estrela">
                <p class="text-black">Importantes</p>
            </li>
            <li>
                <img src="assets/correct2.svg" alt="icone de correto">
                <p class="text-black">Concluídas</p>
            </li>
        </ul>
    </aside>
    <main class="main-container">
        <h1 class="title">Minhas Tarefas</h1>

        <div class="task-group">
            <div class="task-group-header">
                <img src="./assets/calendar.svg" alt="Ícone de Calendário">
                <h2 class="sub-title">Hoje</h2>
            </div>

            <ul class="task-list">
                <li class="task-item">
                    <input type="checkbox" class="task-checkbox">
                    <div class="task-info">
                        <p class="text-black">Revisar documentação do novo módulo de pagamento</p>
                        <div class="task-meta">
                            <img src="./assets/clock.svg" alt="Ícone de Relógio" class="meta-icon">
                            <span class="search-item">10:30 - 11:30</span>
                        </div>
                    </div>
                </li>

                <li class="task-item">
                    <input type="checkbox" class="task-checkbox">
                    <div class="task-info">
                        <p class="text-black">Reunião de alinhamento com a equipe de marketing</p>
                        <div class="task-meta">
                            <img src="./assets/clock.svg" alt="Ícone de Relógio" class="meta-icon">
                            <span class="search-item">14:30 - 15:30</span>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </main>
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="sub-title">Nova Tarefa</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>

            <form id="createTaskForm">
                <div class="form-group">
                    <label for="taskName" class="text-black">Nome da Tarefa *</label>
                    <input type="text" id="taskName" name="name" class="form-input" required
                        placeholder="Ex: Revisar documentação">
                </div>

                <div class="form-group">
                    <label for="taskDescription" class="text-black">Descrição *</label>
                    <textarea id="taskDescription" name="description" class="form-input" required rows="3"
                        placeholder="Detalhes da tarefa..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory" class="text-black">Categoria *</label>
                        <input type="text" id="taskCategory" name="category" class="form-input" required
                            placeholder="Ex: Projeto Alpha">
                    </div>
                    <div class="form-group">
                        <label for="taskPriority" class="text-black">Prioridade (1 a 5) *</label>
                        <input type="number" id="taskPriority" name="priority" class="form-input" min="1" max="5"
                            value="1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStartDate" class="text-black">Data/Hora de Início</label>
                        <input type="datetime-local" id="taskStartDate" name="startDate" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="taskEndDate" class="text-black">Data/Hora de Término</label>
                        <input type="datetime-local" id="taskEndDate" name="endDate" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskStatus" class="text-black">Status *</label>
                    <select id="taskStatus" name="status" class="form-input" required>
                        <option value="TODO" selected>A Fazer (TODO)</option>
                        <option value="DOING">Fazendo (DOING)</option>
                        <option value="DONE">Concluído (DONE)</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" id="cancelTaskBtn" class="btn-cancel text-black">Cancelar</button>
                    <button type="submit" class="btn-submit button-white">Criar Tarefa</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
